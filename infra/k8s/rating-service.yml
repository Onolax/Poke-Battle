apiVersion: apps/v1
kind: Deployment
metadata:
  name: rating-service
  namespace: poke-battle
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rating-service
  template:
    metadata:
      labels:
        app: rating-service
    spec:
      containers:
        - name: rating-service
          image: rating-service:v2
          imagePullPolicy: Never
          ports:
            - containerPort: 8085
          envFrom:
            - configMapRef:
                name: poke-battle-config
            - secretRef:
                name: poke-battle-secrets
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            tcpSocket:
              port: 8085
            initialDelaySeconds: 20
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: rating-service
  namespace: poke-battle
spec:
  selector:
    app: rating-service
  ports:
    - port: 8085
      targetPort: 8085
