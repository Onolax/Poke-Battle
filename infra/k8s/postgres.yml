apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: poke-battle
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: pokemon
            - name: POSTGRES_USER
              value: pokemon
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: poke-battle-secrets
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "pokemon"]
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: postgres-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: poke-battle
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
